  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">

        </svg>
        <span>North Star <em>Outfitters</em></span>

      <nav class="site-nav" aria-label="Main">
        <a href="#/shop" data-nav="shop">Shop</a>
        <a href="#/faq" data-nav="faq">FAQ</a>
        <a href="#/about" data-nav="about">About</a>
        <a href="#/cart" class="cart-link" data-nav="cart" aria-label="Your cart">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6 L6 6 L8.5 16 L19 16 L21 8 L7 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="10" cy="20" r="1.6" /><circle cx="17" cy="20" r="1.6" /></svg>
          <span class="cart-badge" id="cart-badge">0</span>

        <button type="button" class="nav-support" data-open-chat>Support</button>
      </nav>
    </header>

    <main id="main">
      <div id="app"></div>
    </main>

    <footer class="site-footer">
      <nav class="footer-nav" aria-label="Footer">
        <a href="#/shop">Shop</a>
        <a href="#/faq">FAQ</a>
        <a href="#/about">About</a>
        <a href="#/cart">Cart</a>
      </nav>
      <p>
        ⭐ North Star Outfitters is a fictional store built for the North Star Support Bot
        demo. No real products, orders, or payments.
      </p>
    </footer>

    <!-- Chat widget -->
    <button type="button" class="chat-launcher" id="chat-launcher" aria-label="Open support chat" aria-expanded="false" aria-controls="chat-panel">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 0 L14.4 9.6 L24 12 L14.4 14.4 L12 24 L9.6 14.4 L0 12 L9.6 9.6 Z" />
      </svg>
    </button>

    <section class="chat-panel" id="chat-panel" role="dialog" aria-label="North Star Support Bot" hidden>
      <header class="chat-header" id="chat-header">
        <div class="chat-avatar" id="chat-avatar" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M12 0 L14.4 9.6 L24 12 L14.4 14.4 L12 24 L9.6 14.4 L0 12 L9.6 9.6 Z" />
          </svg>
        </div>
        <div class="chat-title">
          <strong id="chat-name">North Star Support Bot</strong>
          <span id="chat-status"><i class="dot"></i> Usually replies instantly</span>
        </div>
        <button type="button" class="chat-close" id="chat-close" aria-label="Minimize chat">−</button>
      </header>
      <div class="chat-log" id="chat-log" role="log" aria-live="polite"></div>
      <div class="chat-chips" id="chat-chips"></div>
      <form class="chat-input" id="chat-form">
        <label class="visually-hidden" for="chat-text">Type your message</label>
        <input id="chat-text" type="text" placeholder="Type a message…" autocomplete="off" />
        <button type="submit" aria-label="Send message">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12 L21 3 L14 12 L21 21 Z" /></svg>
        </button>
      </form>
